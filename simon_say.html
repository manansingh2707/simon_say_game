<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="simon_say.css">
    <title>Document</title>
</head>
<body>
    <h1>Simon Says game</h1>
    <h2>Press any key to start the game</h2>
    <h4></h4>
    <div class="parent">
        <div class="line1">
            <div class="child red btn" id="red"></div>
            <div class="child orange btn" id="orange"></div>
            
        </div>
        <div class="line2">
            <div class="child green btn" id="green"></div>
            <div class="child blue btn" id="blue"></div>
        </div>
    </div>
    <button onclick=location.reload()>REFRESH</button>
    <script src="simon_say.js"></script>
</body>
</html>
